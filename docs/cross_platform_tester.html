<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyx Cross-Platform Device Simulator & Tester</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #080c14; color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; }
        .platform-nav { display: flex; gap: 1rem; justify-content: center; margin: 2rem 0; flex-wrap: wrap; }
        .platform-btn { background: #131b2e; border: 1px solid #1e293b; color: #94a3b8; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 700; cursor: pointer; transition: all 0.2s; font-size: 1rem; }
        .platform-btn.active, .platform-btn:hover { background: #00e5ff; color: #080c14; border-color: #00e5ff; box-shadow: 0 0 15px rgba(0,229,255,0.4); }
        .simulator-stage { display: flex; justify-content: center; align-items: center; min-height: 600px; padding: 1rem; }
        .device-frame { background: #0f172a; border-radius: 36px; padding: 16px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7); border: 4px solid #334155; position: relative; transition: all 0.3s; }
        .device-screen { background: #080c14; border-radius: 24px; overflow: hidden; position: relative; border: 1px solid #1e293b; }
        
        /* Phone Dimensions */
        .device-frame.mobile { width: 380px; height: 680px; }
        .device-frame.mobile .device-screen { width: 100%; height: 100%; }
        
        /* Desktop/Web Dimensions */
        .device-frame.desktop { width: 960px; height: 560px; border-radius: 16px; padding: 12px; }
        .device-frame.desktop .device-screen { width: 100%; height: 100%; border-radius: 8px; }

        .notch { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); width: 120px; height: 24px; background: #000; border-radius: 12px; z-index: 10; }
        .telemetry-card { background: #131c30; border: 1px solid #1e2d4a; border-radius: 10px; padding: 1rem; margin: 0.75rem; }
        .pill { background: #00e676; color: #080c14; font-size: 0.75rem; font-weight: 800; padding: 0.2rem 0.5rem; border-radius: 4px; }
    </style>
</head>
<body>
    <div style="max-width: 1200px; margin: 0 auto; padding: 2rem 1rem;">
        <div style="text-align: center;">
            <span class="pill">NYX CROSS-PLATFORM RUNTIME SUITE</span>
            <h1 style="font-size: 2.4rem; margin: 0.5rem 0; color: #ffffff;">Universal Device Simulator & Tester</h1>
            <p style="color: #94a3b8;">Verify Nyx native execution across Android NDK, Apple iOS, macOS Darwin, Linux ELF, and WebAssembly</p>
        </div>

        <div class="platform-nav">
            <button class="platform-btn active" onclick="switchPlatform('android')">🤖 Android (NDK arm64)</button>
            <button class="platform-btn" onclick="switchPlatform('ios')">🍎 Apple iOS (Metal)</button>
            <button class="platform-btn" onclick="switchPlatform('wasm')">🌐 WebAssembly (Browser)</button>
            <button class="platform-btn" onclick="switchPlatform('macos')">💻 macOS (Universal)</button>
            <button class="platform-btn" onclick="switchPlatform('linux')">🐧 Linux (Static ELF)</button>
        </div>

        <div class="simulator-stage">
            <div id="deviceFrame" class="device-frame mobile">
                <div id="notchBar" class="notch"></div>
                <div class="device-screen" id="deviceContent">
                    <!-- Dynamic platform simulation rendered via JS -->
                </div>
            </div>
        </div>

        <div style="text-align: center; margin-top: 2rem;">
            <a href="index.html" class="btn btn-secondary">&larr; Back to Documentation</a>
            <a href="../comparison.html" class="btn btn-primary" style="margin-left: 1rem;">🏆 View 2026 Benchmarks</a>
        </div>
    </div>

    <script>
        function switchPlatform(platform) {
            document.querySelectorAll('.platform-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            const frame = document.getElementById('deviceFrame');
            const notch = document.getElementById('notchBar');
            const content = document.getElementById('deviceContent');

            if (platform === 'android') {
                frame.className = 'device-frame mobile';
                notch.style.display = 'block';
                content.innerHTML = `
                    <div style="padding: 48px 16px 16px 16px;">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <h3 style="color:#00e5ff; margin:0;">Athena Mobile</h3>
                            <span class="pill">aarch64-android</span>
                        </div>
                        <p style="font-size:0.85rem; color:#94a3b8;">libnyx_app.so loaded via JNI NativeActivity (Vulkan 1.3)</p>
                        
                        <div class="telemetry-card">
                            <div style="font-size:0.8rem; color:#94a3b8;">LIVE STOCK PRICE</div>
                            <div style="font-size:1.6rem; font-weight:800; color:#00e676;">GOOGL $337.71</div>
                            <div style="font-size:0.85rem; color:#00e676;">+1.46% (Alpha Fair Value: $442.10)</div>
                        </div>

                        <div class="telemetry-card">
                            <div style="font-size:0.8rem; color:#94a3b8;">6-AXIS IMU SENSORS</div>
                            <div style="font-family:monospace; font-size:0.8rem; color:#cbd5e1;">
                                ACCEL: (0.02, 9.81, 0.05) m/s²<br>
                                GYRO:  (0.001, 0.002, 0.000) rad/s<br>
                                REFRESH: 120 Hz Smooth Motion
                            </div>
                        </div>

                        <div class="telemetry-card">
                            <div style="font-size:0.8rem; color:#94a3b8;">HAPTIC MOTOR TRIGGER</div>
                            <button style="width:100%; background:#7c4dff; color:#fff; border:none; padding:0.6rem; border-radius:6px; font-weight:700; cursor:pointer; margin-top:0.4rem;">
                                📳 Trigger Success Haptic
                            </button>
                        </div>
                    </div>
                `;
            } else if (platform === 'ios') {
                frame.className = 'device-frame mobile';
                notch.style.display = 'block';
                content.innerHTML = `
                    <div style="padding: 48px 16px 16px 16px;">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <h3 style="color:#00e5ff; margin:0;">Athena iOS</h3>
                            <span class="pill" style="background:#ff007f; color:#fff;">arm64-apple-ios</span>
                        </div>
                        <p style="font-size:0.85rem; color:#94a3b8;">AthenaApp.xcframework & Metal 3 GPU pipeline</p>
                        
                        <div class="telemetry-card">
                            <div style="font-size:0.8rem; color:#94a3b8;">PROMOTION RETINA DISPLAY</div>
                            <div style="font-size:1.4rem; font-weight:800; color:#fff;">3.0x Density (460 ppi)</div>
                            <div style="font-size:0.85rem; color:#00e5ff;">120.0 FPS Metal Surface</div>
                        </div>

                        <div class="telemetry-card">
                            <div style="font-size:0.8rem; color:#94a3b8;">MULTI-TOUCH RESOLUTION</div>
                            <div style="font-family:monospace; font-size:0.8rem; color:#cbd5e1;">
                                POINTER #0: (195.0, 422.0) Pres=0.85<br>
                                POINTER #1: (225.0, 452.0) Pres=0.82<br>
                                GESTURE: PinchZoom (1.35x Scale)
                            </div>
                        </div>
                    </div>
                `;
            } else if (platform === 'wasm') {
                frame.className = 'device-frame desktop';
                notch.style.display = 'none';
                content.innerHTML = `
                    <div style="padding: 24px;">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <h3 style="color:#00e5ff; margin:0;">WebAssembly (WASM SIMD128) & WebGPU Browser Runtime</h3>
                            <span class="pill">WASM32</span>
                        </div>
                        <p style="color:#94a3b8;">Running pure client-side in browser memory with zero server compilation latency.</p>
                        <iframe src="../web-runtime/index.html" style="width:100%; height:400px; border:none; border-radius:8px; background:#000;"></iframe>
                    </div>
                `;
            } else if (platform === 'macos') {
                frame.className = 'device-frame desktop';
                notch.style.display = 'none';
                content.innerHTML = `
                    <div style="padding: 24px; font-family:monospace;">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <h3 style="color:#00e5ff; margin:0;">macOS Terminal (Universal Mach-O)</h3>
                            <span class="pill">Darwin arm64/x86_64</span>
                        </div>
                        <div style="background:#000; padding:1.5rem; border-radius:8px; margin-top:1rem; color:#00e676; line-height:1.6;">
                            $ clang -O3 -arch arm64 -framework Cocoa -framework Metal -o Athena src/main.c<br>
                            $ ./Athena<br>
                            [NYX] Initializing Cocoa NSApplication & Metal pipeline... OK<br>
                            [NYX] Region Inference: 82.4% bump allocations, 0.00 ms GC pause... OK<br>
                            [ATHENA] 60 FPS Institutional Trading Workstation Active on macOS Sonoma.
                        </div>
                    </div>
                `;
            } else if (platform === 'linux') {
                frame.className = 'device-frame desktop';
                notch.style.display = 'none';
                content.innerHTML = `
                    <div style="padding: 24px; font-family:monospace;">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <h3 style="color:#00e5ff; margin:0;">Linux Static ELF64 (Wayland / X11)</h3>
                            <span class="pill">x86_64-linux-gnu</span>
                        </div>
                        <div style="background:#000; padding:1.5rem; border-radius:8px; margin-top:1rem; color:#00e676; line-height:1.6;">
                            $ gcc -O3 -flto -o athena_trader_linux examples/demo_athena_native_ui.c -lm -lpthread -ldl<br>
                            $ file athena_trader_linux<br>
                            athena_trader_linux: ELF 64-bit LSB pie executable, x86-64, dynamically linked (uses shared libs)<br>
                            $ ./athena_trader_linux<br>
                            [NYX] Linux Wayland/X11 GDI/Skia rendering active @ 120 FPS.<br>
                            [ATHENA] Trading station live (Zero external dependencies).
                        </div>
                    </div>
                `;
            }
        }
        // Initialize default view
        switchPlatform('android');
    </script>
    <script src="https://specforge.9jaoncloud.com.ng/assets/js/specforge-widget.js" data-token="85ef1ac50900f8bff142c95c85287db4" defer></script>
</body>
</html>
